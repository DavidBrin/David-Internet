[env:adafruit_feather_esp32s3]
; Use short build path to avoid "opening dependency file ... No such file or directory" on Windows
; (long project paths + TensorFlowLite deep tree can exceed path limits or fail to create .d files)
platform = espressif32
board = adafruit_feather_esp32s3
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit AMG88xx Library
    tanakamasayuki/TensorFlowLite_ESP32
